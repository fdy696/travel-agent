[project]
name = "travel-agent-v6"
version = "0.2.0"
description = "行伴 Travel Agent v6 — Main Agent + Travel Skill + Travel Researcher + Travel Tools"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.0",
    "tavily>=0.5",
    "ddgs>=9.14.4",
    "httpx>=0.27",
    "langchain>=1.0",
    "langchain-deepseek>=1.0",
    "langgraph>=1.0",
    "deepagents>=0.7.4",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
travel-agent = "cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "__init__.py",
    "agent.py",
    "cli.py",
    "config.py",
    "middleware",
    "subagents",
    "tools",
    "skills",
]
