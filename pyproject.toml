[project]
name = "travel-agent-v4"
version = "0.2.0"
description = "智能旅游助手：Main Deep Agent + declarative Travel Plan SubAgent + deterministic domain boundary"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.0",
    "tavily>=0.5",
    "httpx>=0.27",
    "langchain>=1,<2",
    "langchain-deepseek>=1,<2",
    "langgraph>=1,<2",
    "deepagents>=0.6,<0.7",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["__init__.py", "agent.py", "cli.py", "config.py", "tools", "planning", "skills"]

[dependency-groups]
dev = [
    "debugpy>=1.8.21",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
